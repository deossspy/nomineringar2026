<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root { 
  --gold: #f5d27a; 
  --metallic: linear-gradient(to bottom, #cfb53b 0%, #f5d27a 50%, #b8860b 100%);
}

*{box-sizing:border-box}

body {
  margin: 0;
  font-family: 'Cinzel', serif;
  background: #000;
  color: var(--gold);
  overflow: hidden;
  width: 100vw;
  height: 100vh;
}

.lights-container {
  position: absolute;
  width: 100%; height: 100%;
  overflow: hidden;
  pointer-events: none;
  z-index: 0;
}

.light {
  position: absolute;
  width: 80vh; height: 80vh;
  background: radial-gradient(circle, rgba(255,215,0,0.1) 0%, rgba(255,215,0,0.03) 40%, transparent 70%);
  border-radius: 50%;
  filter: blur(60px);
  animation: rotateLights 25s infinite ease-in-out;
}

.light:nth-child(1) { top: -20%; left: -10%; }
.light:nth-child(2) { bottom: -20%; right: -10%; animation-direction: reverse; }
.light:nth-child(3) { top: 30%; left: 60%; opacity: 0.3; }

@keyframes rotateLights {
  0%, 100% { transform: translate(0, 0) scale(1); }
  50% { transform: translate(5vw, 5vh) scale(1.1); }
}

.metallic-text {
  background: var(--metallic);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  display: inline-block;
  filter: drop-shadow(0 2px 10px rgba(0,0,0,0.7));
}

.slide {
  position: absolute;
  width: 100%; height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  opacity: 0;
  transition: all .8s ease;
  pointer-events: none;
  z-index: 1;
}

.active { opacity: 1; pointer-events: auto; }

h1 { font-size: 8vh; letter-spacing: 1vh; margin: 0; }
h2 { font-size: 3vh; opacity: .8; margin: 1vh 0 0 0; }

.category {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 100%;
  font-size: 6vh;
  transition: all 0.9s cubic-bezier(.2,.8,.2,1);
  z-index: 2;
  letter-spacing: 0.5vh;
}

.category.move-up { top: 10%; transform: translate(-50%, 0); }

.nominees {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 4vw;
  margin-top: 12vh;
  z-index: 2;
}

.nominee {
  opacity: 0;
  transform: translateY(5vh);
  transition: all .7s ease;
  font-size: 2.5vh;
}

.nominee.show { opacity: 1; transform: translateY(0); }

.nominee img {
  width: 20vw; height: 20vw;
  max-width: 280px; max-height: 280px;
  object-fit: cover;
  border-radius: 1vh;
  border: 0.4vh solid var(--gold);
  box-shadow: 0 1vh 3vh rgba(0,0,0,0.8);
  margin-bottom: 2vh;
}

.zoom-container {
  position: absolute;
  width: 100%; height: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
  transition: all 1.2s cubic-bezier(.2,.8,.2,1);
}

.fullscreen-winner {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  display: flex;
  flex-direction: row; 
  justify-content: center;
  align-items: center;
  gap: 8vw;
  background: rgba(0,0,0,0.94);
  backdrop-filter: blur(20px);
  animation: fadeIn .7s ease;
  z-index: 10;
  padding: 0 10vw;
  text-align: left;
}

.win-left {
  flex: 0 0 auto;
  display: flex;
  justify-content: center;
  align-items: center;
}

.fullscreen-winner img {
  width: 45vh; height: 45vh;
  max-width: 420px; max-height: 420px;
  border: 0.5vh solid var(--gold); 
  box-shadow: 0 0 5vh rgba(245, 210, 122, 0.3);
  border-radius: 50%; 
  object-fit: cover;
}

.win-right {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  justify-content: center;
  max-width: 600px;
}

.win-tag {
  background-color: #cfb53b;
  color: #000;
  font-weight: bold;
  padding: 0.8vh 2.5vh;
  font-size: 2vh;
  letter-spacing: 0.3vh;
  margin-bottom: 3vh;
  text-transform: uppercase;
}

.fullscreen-winner .name {
  font-size: 7.5vh;
  margin: 0 0 2vh 0;
  line-height: 1.1;
  text-transform: uppercase;
}

.win-description {
  font-family: sans-serif; 
  font-size: 2.2vh;
  line-height: 1.6;
  color: #fff;
  opacity: 0.85;
  margin: 0;
}

.video-container {
  width: 100%; height: 100%;
  background: #000;
  display: flex; justify-content: center; align-items: center;
}

.video-container video {
  width: 100%; height: 100%; object-fit: contain;
}

/* STYLING FÖR GISSA 9AN SPELET */
.game-container {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3vh;
}

.game-number {
  font-size: 10vh;
  font-weight: bold;
  line-height: 1;
}

.game-frame {
  position: relative;
  width: 45vh; height: 45vh;
  max-width: 400px; max-height: 400px;
  border: 0.5vh solid var(--gold);
  border-radius: 2vh;
  overflow: hidden;
  box-shadow: 0 2px 30px rgba(245,210,122,0.2);
}

.game-frame img {
  width: 100%; height: 100%; object-fit: cover;
}

.game-instruction {
  font-size: 3vh;
  opacity: 0.8;
}

.answer-container {
  display: flex;
  flex-direction: row;
  align-items: center;
  justify-content: center;
  gap: 6vw;
  animation: fadeIn 0.5s ease;
}

.answer-box {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2vh;
}

.answer-box .game-frame {
  border-radius: 50%; /* Rund fasitsbild */
}

.answer-text-block {
  text-align: left;
}

.answer-title {
  font-size: 4vh;
  color: #fff;
  margin-bottom: 1vh;
}

.answer-name {
  font-size: 8vh;
  text-transform: uppercase;
  margin: 0;
}

@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.end { font-size: 8vh; }
</style>
</head>

    }

    // NYTT: Enskilt facit / Rätt svar (1-18)
    if(item.type==="game-answer") {
      slide.innerHTML=`
        <div class="answer-container">
          <div class="answer-box">
            <div class="game-number metallic-text" style="font-size: 6vh;">#${item.id}</div>
            <div class="game-frame">
              <img src="${item.realImg}" alt="${item.name}">
            </div>
          </div>
          <div class="answer-text-block">
            <div class="answer-title">Rätt svar är:</div>
            <h1 class="answer-name metallic-text">${item.name}</h1>
          </div>
        </div>
      `;
    }

    container.appendChild(slide);
  });
}
createSlides();

const slides=document.querySelectorAll(".slide");

function showNomineesAuto(){
  const category = slides[current].querySelector('.category');
  const nominees = slides[current].querySelectorAll('.nominee');
  
  if(category) category.classList.remove('move-up');
  nominees.forEach(n => n.classList.remove('show'));

  timeoutIds.push(setTimeout(()=>{ if(category) category.classList.add('move-up'); }, 1800));
  timeoutIds.push(setTimeout(()=>{ nominees.forEach((n,i)=>{ timeoutIds.push(setTimeout(()=>{ n.classList.add('show'); }, i*2700)); }); }, 2600));
}

function showWinner(){
  if(revealed) return;
  const slideData=data[current];
  if(slideData.type!=="category") return;

  const slideEl = slides[current];
  const zoom=slideEl.querySelector(".zoom-container");

  if(zoom){
    zoom.style.filter = "brightness(0.2) blur(10px)";
    zoom.style.transform = "scale(1.1)";
  }

  const winner=slideData.nominees[slideData.winner];
  const overlay=document.createElement("div");
  overlay.className="fullscreen-winner";
  
  overlay.innerHTML=`
    <div class="win-left">
      <img src="${winner.img}">
    </div>
    <div class="win-right">
      <div class="win-tag">Vinnare</div>
      <div class="name metallic-text">${winner.name}</div>
      <p class="win-description">${generateDescription(slideData, winner.name)}</p>
    </div>
  `;

  setTimeout(()=>{ slideEl.appendChild(overlay); }, 500);
  revealed = true;
}

function handleVideoSlide() {
  const slideData = data[current];
  const video = slides[current].querySelector('video');
  
  if(video) {
    if(slideData.hasPlayed) {
      video.pause();
      video.currentTime = video.duration || 0; 
      videoFinished = true; 
    } else {
      videoFinished = false; 
      video.currentTime = 0;
      video.play().catch(err => console.log("Autoplay blockerad:", err));
      
      video.onended = () => {
        video.pause();
        if(video.duration) video.currentTime = video.duration; 
        videoFinished = true;
        slideData.hasPlayed = true; 
      };
    }
  }
}

function stopVideoSlide() {
  const video = slides[current].querySelector('video');
  if(video) {
    video.pause();
    video.onended = null;
  }
}

function nextSlide(){
  timeoutIds.forEach(clearTimeout);
  timeoutIds = [];
  
  if(data[current].type === "video") {
    stopVideoSlide();
  }

  const activeOverlay = slides[current].querySelector(".fullscreen-winner");
  if(activeOverlay) activeOverlay.remove();

  const zoom=slides[current].querySelector(".zoom-container");
  if(zoom){
    zoom.style.filter = "none";
    zoom.style.transform = "none";
  }

  revealed=false;
  slides[current].classList.remove("active");
  current=(current+1)%slides.length;
  slides[current].classList.add("active");

  if(data[current].type==="category") showNomineesAuto();
  if(data[current].type==="video") handleVideoSlide();
}

function prevSlide() {
  timeoutIds.forEach(clearTimeout);
  timeoutIds = [];

  if(data[current].type === "video") {
    stopVideoSlide();
  }

  const activeOverlay = slides[current].querySelector(".fullscreen-winner");
  if(activeOverlay) activeOverlay.remove();

  const zoom=slides[current].querySelector(".zoom-container");
  if(zoom){
    zoom.style.filter = "none";
    zoom.style.transform = "none";
  }

  revealed=false;
  slides[current].classList.remove("active");
  
  current = (current - 1 + slides.length) % slides.length;
  slides[current].classList.add("active");

  if(data[current].type==="category") showNomineesAuto();
  if(data[current].type==="video") handleVideoSlide();
}

document.addEventListener("keydown",e=>{
  if(e.code==="Space" || e.code==="ArrowRight") {
    e.preventDefault();
    
    if(data[current].type === "video" && !videoFinished) {
      return; 
    }

    if(data[current].type==="category" && !revealed){
      showWinner();
    } else {
      nextSlide();
    }
  }
  
  if(e.code==="Backspace" || e.code==="ArrowLeft") {
    e.preventDefault();
    prevSlide();
  }
});
</script>
